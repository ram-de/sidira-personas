# Friends-&-Family validation game persona-build config (v1.1 quad-producing).
# ----------------------------------------------------------------------------
# ⚠️  SYNTHETIC SOURCE for pipeline testing (ticket #443).  ⚠️
# `source.path` points at a SYNTHETIC player_features.csv (60 fabricated rows,
# generated by sessions/ff-validation-game/app/scripts/gen_synthetic_features.js
# in the sidira-simulator repo) so the data → pack → engine-loader path can be
# wired and tested BEFORE any real friend/family player exists. When real
# players have played, the real `exports/player_features.csv` (Table A,
# `npm run export:features`) replaces this source and the pack is rebuilt from
# THAT at run time — the committed pack derived from this config is throwaway
# test scaffolding.
#
# The source is Table A ONLY: PRE-TREATMENT features (demographics + the 5
# decision-style scores + the #440 Deal/Trust/Ambiguity scores + the passive
# gameplay-revealed features). It carries NO arm and NO outcome by construction
# (the game's leakage firewall keeps those in a separate sealed table) — so the
# clustering can never leak the answer key.
#
# Modeled on config/streamly.yaml. The latent play-style label is deliberately
# absent — the pipeline must DISCOVER the segments.

company_id: friends_family
run_id_prefix: friends_family

source:
  type: local
  path: fixtures/friends_family_synthetic_features.csv
  user_id_column: player_id

feature_groups:

  # Demographics (the tap-only Seller Card). Excluded from clustering (below) so
  # segments are defined by HOW people decide, not who they are — demographics
  # describe the discovered clusters rather than driving them.
  demographic_identity:
    - {name: age_band,     type: categorical}
    - {name: locale,       type: categorical}
    - {name: device,       type: categorical}
    - {name: tenure_days,  type: tenure_days}

  # The 5 core decision-style scores revealed through profiling-room play.
  decision_style:
    - {name: decision_speed,    type: score}
    - {name: deal_sensitivity,  type: score}
    - {name: present_bias,      type: score}
    - {name: effort_tolerance,  type: score}
    - {name: reactance,         type: score}

  # #440 Deal / Trust / Ambiguity room scores (also pre-treatment decision-style).
  social_economic_style:
    - {name: patience,            type: score}
    - {name: trust,               type: score}
    - {name: reciprocity,         type: score}
    - {name: ambiguity_aversion,  type: score}

  # Passive gameplay-revealed behavioral features (can't be self-reported / gamed).
  behavioral_patterns:
    - {name: warmup_decision_ms,        type: count}
    - {name: warmup_options_inspected,  type: count}
    - {name: warmup_skip_rate,          type: ratio}
    - {name: warmup_reread_rate,        type: ratio}

# No snapshot/baseline-segment columns: the export carries no date column and no
# pre-defined segment label (the latent style is intentionally not emitted).

# Cluster on decision style + behavior; demographics describe, don't drive.
clustering_exclude_groups: [demographic_identity]

encoder:
  method: pca
  # 2 (not 4) PCA dims per group: with ~60 players across 3 clustering groups,
  # 4 dims/group → a 12-D space that a full-covariance GMM over-parameterizes,
  # so BIC over-splits on noise. 2 dims/group (a 6-D space) keeps BIC well-behaved
  # — it selects k=3 (the three latent play-styles) with every cluster stable
  # (per-cluster Jaccard ≫ 0.6) and ≥10 players each. Revisit upward once the real
  # player count is large enough to support a higher-dimensional embedding.
  embedding_dim_per_group: 2

cluster:
  method: gmm
  k_range: [2, 4]
  selection: bic
  random_state: 42
  bootstrap_iters: 50
  stability_threshold: 0.6
  holdout_frac: 0.0

weights:
  # The F&F game has no order / revenue signal — headcount only (like the
  # Hillstrom / Cookie Cats RCT packs).
  schemes: [headcount]
  orders_column: null
  revenue_column: null

sampling:
  n_synthetic_rows: 32
  random_state: 42

prompt_compiler:
  top_n_distinctive_features_per_group: 4
  threshold_sigma: 0.3
