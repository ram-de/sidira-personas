[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythia-personas"
version = "0.1.0"
description = "Per-company persona calibration for Pythia simulation agents"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "snowflake-connector-python>=3.7",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "click>=8.1",
    "hdbscan>=0.8.33",
    "anthropic>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "black>=24.4", "ipykernel"]

[project.scripts]
pythia-personas = "pythia_personas.cli:cli"

[tool.setuptools.packages.find]
include = ["pythia_personas*"]
